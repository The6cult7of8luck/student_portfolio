   name: Portfolio CI Check

   on:
     push:
       branches: [ "main" ]
     pull_request:
       branches: [ "main" ]

   jobs:
     build:
       runs-on: ubuntu-latest

       steps:
       - name: Checkout repository
         uses: actions/checkout@v3

       - name: Run a simple check
         run: |
           echo "Starting CI checks..."
           test -f README.md && echo "README.md exists! Test passed."